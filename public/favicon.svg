<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Emerald Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143D32" />
      <stop offset="50%" stop-color="#0E2821" />
      <stop offset="100%" stop-color="#071410" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A701E" />
    </linearGradient>

    <!-- Page Parchment Gradient -->
    <linearGradient id="pageGradLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EFE8D8" />
      <stop offset="70%" stop-color="#FAF7F0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFE8D8" />
      <stop offset="70%" stop-color="#FAF7F0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    
    <!-- Gold Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#B48327" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Container (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Subtle 8-Pointed Star Watermark in Background -->
  <g opacity="0.18" stroke="url(#goldGrad)" stroke-width="0.8" fill="none">
    <rect x="18" y="18" width="28" height="28" rx="2" />
    <rect x="18" y="18" width="28" height="28" rx="2" transform="rotate(45 32 32)" />
  </g>

  <!-- Mini Islamic Star at Top -->
  <g transform="translate(32, 13) scale(0.7)">
    <polygon points="0,-4.5 1.3,-1.3 4.5,0 1.3,1.3 0,4.5 -1.3,1.3 -4.5,0 -1.3,-1.3" fill="url(#goldGrad)" />
  </g>

  <!-- Open Quran Book -->
  <g id="quran-book">
    <!-- Book Stand / Base Shadow -->
    <path d="M19 46.5 C26 44 32 47 32 47 C32 47 38 44 45 46.5 C46.5 47 45.5 49 43 49 C37 49 32 47.5 32 47.5 C32 47.5 27 49 21 49 C18.5 49 17.5 47 19 46.5 Z" fill="#081410" opacity="0.6" />

    <!-- Book Covers (Deep Gold / Leather backing) -->
    <path d="M13 22 C22 20.5 31 23 31.5 24 L31.5 44 C31 43 22 40.5 13 42 Z" fill="#8C661D" />
    <path d="M51 22 C42 20.5 33 23 32.5 24 L32.5 44 C33 43 42 40.5 51 42 Z" fill="#8C661D" />

    <!-- Left Open Page -->
    <path d="M14 21.5 C22.5 20 30.5 22.5 31.5 23.5 L31.5 42.5 C30.5 41.5 22.5 39 14 40.5 Z" fill="url(#pageGradLeft)" />
    <!-- Right Open Page -->
    <path d="M50 21.5 C41.5 20 33.5 22.5 32.5 23.5 L32.5 42.5 C33.5 41.5 41.5 39 50 40.5 Z" fill="url(#pageGradRight)" />

    <!-- Inner Margin Border on Pages (Illuminated Quran Style) -->
    <path d="M16.5 23.5 C22.5 22.5 28.5 24 29.5 25 L29.5 40.5 C28.5 39.5 22.5 38 16.5 39 Z" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.7" />
    <path d="M47.5 23.5 C41.5 22.5 35.5 24 34.5 25 L34.5 40.5 C35.5 39.5 41.5 38 47.5 39 Z" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.7" />

    <!-- Sacred Ayah Lines (Delicate typography hints) -->
    <!-- Left page lines -->
    <line x1="18" y1="26.5" x2="28" y2="27.5" stroke="#4A5D54" stroke-width="0.8" stroke-linecap="round" opacity="0.55" />
    <line x1="18" y1="30" x2="28" y2="31" stroke="#4A5D54" stroke-width="0.8" stroke-linecap="round" opacity="0.55" />
    <line x1="18" y1="33.5" x2="28" y2="34.5" stroke="#4A5D54" stroke-width="0.8" stroke-linecap="round" opacity="0.55" />
    <line x1="18" y1="37" x2="25" y2="37.7" stroke="#4A5D54" stroke-width="0.8" stroke-linecap="round" opacity="0.55" />

    <!-- Right page lines -->
    <line x1="36" y1="27.5" x2="46" y2="26.5" stroke="#4A5D54" stroke-width="0.8" stroke-linecap="round" opacity="0.55" />
    <line x1="36" y1="31" x2="46" y2="30" stroke="#4A5D54" stroke-width="0.8" stroke-linecap="round" opacity="0.55" />
    <line x1="36" y1="34.5" x2="46" y2="33.5" stroke="#4A5D54" stroke-width="0.8" stroke-linecap="round" opacity="0.55" />
    <line x1="39" y1="37.7" x2="46" y2="37" stroke="#4A5D54" stroke-width="0.8" stroke-linecap="round" opacity="0.55" />

    <!-- Center Book Spine Shadow -->
    <line x1="32" y1="23" x2="32" y2="43.5" stroke="#B48327" stroke-width="1" stroke-linecap="round" />

    <!-- Golden Bookmark Ribbon (شريط العلامة) hanging down -->
    <path d="M31.2 23 C31.2 23 32.5 32 30.5 44 L32.5 48 L34.5 44 C32.5 32 32.8 23 32.8 23 Z" fill="url(#ribbonGrad)" stroke="#8C661D" stroke-width="0.3" />
  </g>
</svg>
